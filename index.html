<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Naith 💛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f8cf58;
      --gold-soft: #ffdf7e;
      --dark: #090807;
      --wine: #281514;
    }

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  color: #fff9e8;
  background:
    radial-gradient(circle at 50% 28%, rgba(124, 80, 22, 0.19), transparent 30rem),
    radial-gradient(circle at 15% 85%, rgba(90, 27, 28, 0.18), transparent 24rem),
    linear-gradient(145deg, #050505 0%, var(--dark) 48%, #130d0b 100%);
  font-family: "Cormorant Garamond", Georgia, serif;
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 42vmax;
  height: 42vmax;
  border: 1px solid rgba(248, 207, 88, 0.06);
  border-radius: 50%;
  pointer-events: none;
}

body::before {
  top: -24vmax;
  left: -19vmax;
}

body::after {
  right: -24vmax;
  bottom: -28vmax;
}

.scene {
  position: relative;
  width: min(92vw, 760px);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 20px;
  isolation: isolate;
}

.ambient-glow {
  position: absolute;
  width: 330px;
  height: 330px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 209, 80, 0.13), transparent 68%);
  filter: blur(5px);
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 2s ease, transform 2.5s ease;
  z-index: -1;
}

.intro {
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.eyebrow {
  margin: 0 0 12px;
  color: var(--gold);
  font-size: clamp(1rem, 3vw, 1.35rem);
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  color: var(--gold-soft);
  font-family: "Great Vibes", cursive;
  font-size: clamp(4rem, 13vw, 7.8rem);
  font-weight: 400;
  line-height: 0.9;
  text-shadow: 0 0 35px rgba(248, 207, 88, 0.18);
}

.subtitle {
  max-width: 330px;
  margin: 28px auto 34px;
  font-size: clamp(1.35rem, 4.5vw, 1.75rem);
  font-style: italic;
  line-height: 1.35;
  color: rgba(255, 249, 232, 0.82);
}

.open-button {
  position: relative;
  padding: 14px 34px;
  border: 1px solid rgba(248, 207, 88, 0.75);
  border-radius: 999px;
  color: #170f05;
  background: linear-gradient(135deg, #f9d66b, #e7ae34);
  box-shadow: 0 8px 30px rgba(229, 170, 45, 0.18);
  cursor: pointer;
  font: 600 1.2rem/1 "Cormorant Garamond", Georgia, serif;
  letter-spacing: 0.08em;
  transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.7s ease;
  -webkit-tap-highlight-color: transparent;
}

.open-button:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 12px 36px rgba(229, 170, 45, 0.34);
}

.open-button:active {
  transform: scale(0.97);
}

.flower-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 220px;
  height: 330px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -42%) scale(0.45);
  transition: opacity 1.3s ease, transform 2s cubic-bezier(.16, 1, .3, 1);
}

.flower {
  position: absolute;
  inset: 0;
  animation: sway 5s ease-in-out infinite;
  transform-origin: 50% 92%;
}

.stem {
  position: absolute;
  bottom: 30px;
  left: 50%;
  width: 7px;
  height: 168px;
  border-radius: 50% 50% 12px 12px;
  background: linear-gradient(90deg, #455a22, #899a3d 48%, #30471d);
  transform: translateX(-50%);
  box-shadow: 0 0 15px rgba(177, 184, 81, 0.18);
}

.leaf {
  position: absolute;
  width: 58px;
  height: 29px;
  border-radius: 100% 0 100% 0;
  background: linear-gradient(135deg, #829238, #354c1c);
  bottom: 112px;
  left: 50%;
  transform-origin: left center;
}

.leaf.left {
  transform: rotate(151deg);
}

.leaf.right {
  bottom: 82px;
  transform: rotate(28deg) scaleX(-1);
}

.bloom {
  position: absolute;
  top: 36px;
  left: 50%;
  width: 140px;
  height: 140px;
  transform: translateX(-50%);
}

.petal {
  --rotation: 0deg;
  position: absolute;
  left: 50%;
  bottom: 50%;
  width: 55px;
  height: 84px;
  border-radius: 55% 55% 45% 45%;
  background: linear-gradient(135deg, #fff2a6 0%, #f8d54d 43%, #d89218 100%);
  box-shadow: inset -8px -8px 14px rgba(164, 97, 7, 0.17), 0 0 18px rgba(249, 208, 77, 0.18);
  transform-origin: 50% 100%;
  transform: translateX(-50%) rotate(var(--rotation)) translateY(-3px) scale(0.1);
  opacity: 0;
  transition: transform 1.6s cubic-bezier(.2, .85, .25, 1), opacity 0.8s ease;
}

.petal:nth-child(1) { --rotation: 0deg; transition-delay: 0.08s; }
.petal:nth-child(2) { --rotation: 45deg; transition-delay: 0.16s; }
.petal:nth-child(3) { --rotation: 90deg; transition-delay: 0.24s; }
.petal:nth-child(4) { --rotation: 135deg; transition-delay: 0.32s; }
.petal:nth-child(5) { --rotation: 180deg; transition-delay: 0.4s; }
.petal:nth-child(6) { --rotation: 225deg; transition-delay: 0.48s; }
.petal:nth-child(7) { --rotation: 270deg; transition-delay: 0.56s; }
.petal:nth-child(8) { --rotation: 315deg; transition-delay: 0.64s; }

.center {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #8b520d, #4a2806 66%, #1c1003);
  box-shadow: 0 0 0 5px rgba(210, 151, 29, 0.2), 0 0 24px rgba(255, 204, 53, 0.35);
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.2);
  transition: opacity 0.8s ease 0.85s, transform 1.1s cubic-bezier(.2, .85, .25, 1) 0.85s;
}

.message {
  position: absolute;
  width: min(100%, 560px);
  bottom: clamp(46px, 9vh, 94px);
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 1.3s ease, transform 1.3s ease;
}

.message p {
  margin: 0;
  font-size: clamp(1.35rem, 4.6vw, 1.82rem);
  font-style: italic;
  line-height: 1.32;
  color: rgba(255, 249, 232, 0.93);
}

.message p + p {
  margin-top: 7px;
}

.signature {
  margin-top: 22px !important;
  color: var(--gold-soft) !important;
  font-family: "Great Vibes", cursive;
  font-size: clamp(2rem, 6vw, 2.7rem) !important;
  font-style: normal !important;
}

.sparkles {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold-soft);
  box-shadow: 0 0 10px 3px rgba(248, 207, 88, 0.72);
  opacity: 0;
  animation: float 4.5s ease-in-out infinite;
}

body.opened .intro {
  opacity: 0;
  transform: translateY(-16px);
  pointer-events: none;
}

body.opened .open-button {
  opacity: 0;
  transform: scale(0.9);
}

body.opened .ambient-glow {
  opacity: 1;
  transform: scale(1.3);
}

body.opened .flower-wrap {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

body.opened .petal {
  opacity: 1;
  transform: translateX(-50%) rotate(var(--rotation)) translateY(-3px) scale(1);
}

body.opened .center {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

body.show-message .message {
  opacity: 1;
  transform: translateY(0);
}

@keyframes sway {
  0%, 100% { transform: rotate(-2deg); }
  50% { transform: rotate(2deg); }
}

@keyframes float {
  0%, 100% {
    opacity: 0;
    transform: translate3d(0, 14px, 0) scale(0.5);
  }
  25%, 75% {
    opacity: 0.8;
  }
  50% {
    opacity: 1;
    transform: translate3d(12px, -55px, 0) scale(1);
  }
}

@media (max-height: 650px) {
  .flower-wrap {
    transform: translate(-50%, -46%) scale(0.75);
  }

  body.opened .flower-wrap {
    transform: translate(-50%, -52%) scale(0.82);
  }

  .message {
    bottom: 22px;
  }

  .message p {
    font-size: 1.16rem;
  }

  .signature {
    margin-top: 8px !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
  </style>
</head>
<body>
  <audio id="bgm" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <main class="scene">
    <div class="ambient-glow"></div>
    <div class="sparkles" id="sparkles"></div>

<section class="intro" aria-label="Mensaje inicial">
  <p class="eyebrow">Un detalle para ti</p>
  <h1>Para Naith 💛</h1>
  <p class="subtitle">Esto es algo pequeño…<br>pero es solo para ti</p>
  <button class="open-button" id="openButton" type="button">Toca para abrir</button>
</section>

<div class="flower-wrap" aria-hidden="true">
  <div class="flower">
    <div class="bloom">
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="petal"></span>
      <span class="center"></span>
    </div>
    <span class="stem"></span>
    <span class="leaf left"></span>
    <span class="leaf right"></span>
  </div>
</div>

<section class="message" aria-live="polite">
  <p>Si pudiera darte todas las flores del mundo…</p>
  <p>pero ninguna sería suficiente para lo que significas para mí</p>
  <p>así que te dejo esta…</p>
  <p>para recordarte que eres única 💛</p>
  <p class="signature">— Alejandro</p>
</section>
  </main>

  <script>
    const openButton = document.getElementById("openButton");
    const sparkles = document.getElementById("sparkles");

    for (let i = 0; i < 22; i++) {
      const sparkle = document.createElement("span");
      sparkle.className = "sparkle";
      sparkle.style.left = `${8 + Math.random() * 84}%`;
      sparkle.style.top = `${18 + Math.random() * 67}%`;
      sparkle.style.animationDelay = `${Math.random() * 3.5}s`;
      sparkle.style.animationDuration = `${3.5 + Math.random() * 2.5}s`;
      sparkles.appendChild(sparkle);
    }

    openButton.addEventListener("click", () => {
      if (document.body.classList.contains("opened")) return;

      document.body.classList.add("opened");

      const audio = document.getElementById("bgm");
      if (audio) {
        audio.volume = 0.8;
        audio.play().catch(()=>{});
      }

      window.setTimeout(() => {
        document.body.classList.add("show-message");
      }, 2600);
    });
  </script>
</body>
</html>
