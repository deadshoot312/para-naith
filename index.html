<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Naith 💛</title>

<style>
body{
  margin:0;
  height:100vh;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  font-family:sans-serif;
  overflow:hidden;
}

button{
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:gold;
  cursor:pointer;
}

.flower{
  display:none;
  font-size:60px;
  animation:grow 2s ease forwards;
}

@keyframes grow{
  from{transform:scale(0);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

.text{
  opacity:0;
  margin-top:20px;
  text-align:center;
  animation:fade 2s ease forwards;
  animation-delay:2s;
}

@keyframes fade{
  to{opacity:1;}
}
</style>
</head>

<body>

<h1>Para Naith 💛</h1>
<button onclick="start()">Toca aquí</button>

<div class="flower">🌼</div>

<div class="text">
  <p>Si pudiera darte todas las flores del mundo…</p>
  <p>pero ninguna sería suficiente para ti 💛</p>
  <p>— Alejandro</p>
</div>

<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
function start(){
  document.querySelector("button").style.display="none";
  document.querySelector(".flower").style.display="block";

  let audio = document.getElementById("bgm");
  audio.play().catch(()=>{});

  setTimeout(()=>{
    document.querySelector(".text").style.opacity="1";
  },2000);
}
</script>

</body>
</html>
